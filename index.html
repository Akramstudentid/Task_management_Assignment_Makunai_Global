<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input,
        button {
            width: 100%;
            padding: 8px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .task {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Task Management App</h1>

        <div id="auth">
            <h2>Register</h2>
            <div class="form-group">
                <label>Username:</label>
                <input type="text" id="reg-username">
            </div>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="reg-email">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="reg-password">
            </div>
            <button onclick="register()">Register</button>

            <h2>Login</h2>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="login-email">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="login-password">
            </div>
            <button onclick="login()">Login</button>
        </div>

        <div id="tasks" class="hidden">
            <h2>Tasks</h2>
            <div class="form-group">
                <label>Title:</label>
                <input type="text" id="task-title">
            </div>
            <div class="form-group">
                <label>Description:</label>
                <input type="text" id="task-description">
            </div>
            <button onclick="createTask()">Create Task</button>

            <div id="task-list"></div>
        </div>
    </div>

    <script>
        const BASE_URL = '';
        let token = null;

        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                mode: 'cors',
                ...options
            });
            if (!response.ok) {
                const error = await response.text();
                throw new Error(`Error: ${response.status} - ${error}`);
            }
            return response.json();
        }

        async function register() {
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                const result = await apiRequest(`${BASE_URL}/register`, {
                    method: 'POST',
                    body: JSON.stringify({ username, email, password })
                });
                alert('Registered successfully!');
            } catch (error) {
                alert(error.message);
            }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                const result = await apiRequest(`${BASE_URL}/login`, {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });
                token = result.access_token;
                document.getElementById('auth').classList.add('hidden');
                document.getElementById('tasks').classList.remove('hidden');
                loadTasks();
            } catch (error) {
                alert(error.message);
            }
        }

        async function createTask() {
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value;
            try {
                await apiRequest(`${BASE_URL}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title, description })
                });
                document.getElementById('task-title').value = '';
                document.getElementById('task-description').value = '';
                loadTasks();
            } catch (error) {
                alert(error.message);
            }
        }

        async function loadTasks() {
            try {
                const tasks = await apiRequest(`${BASE_URL}/tasks`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const taskList = document.getElementById('task-list');
                taskList.innerHTML = tasks.map(task => `
                    <div class="task">
                        <h3>${task.title}</h3>
                        <p>${task.description}</p>
                        <p>Completed: ${task.completed ? 'Yes' : 'No'}</p>
                        <button onclick="updateTask(${task.id}, '${task.title}', '${task.description}', ${!task.completed})">Toggle Complete</button>
                        <button onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `).join('');
            } catch (error) {
                alert(error.message);
            }
        }

        async function updateTask(id, title, description, completed) {
            try {
                await apiRequest(`${BASE_URL}/tasks/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title, description, completed })
                });
                loadTasks();
            } catch (error) {
                alert(error.message);
            }
        }

        async function deleteTask(id) {
            try {
                await apiRequest(`${BASE_URL}/tasks/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadTasks();
            } catch (error) {
                alert(error.message);
            }
        }
    </script>
</body>

</html>
